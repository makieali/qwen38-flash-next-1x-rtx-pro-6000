<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Decode step"><title>Decode step</title><rect x="0.5" y="0.5" width="959" height="379" rx="14" fill="#ffffff" stroke="#e2e8f0"/><g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><text x="30" y="40" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">One decode step on one card</text><rect x="30" y="80" width="170" height="170" rx="10" fill="#64748b" fill-opacity="0.12"/><rect x="30" y="80" width="170" height="170" rx="10" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="42" y="106" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Next token</text><text x="42" y="132" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">+ 3 drafted by MTP</text><text x="42" y="152" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">(FR-Spec: 64k vocab)</text><line x1="200" y1="165" x2="218" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="218" y="80" width="170" height="170" rx="10" fill="#ea580c" fill-opacity="0.12"/><rect x="218" y="80" width="170" height="170" rx="10" fill="none" stroke="#ea580c" stroke-width="1.5"/><text x="230" y="106" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">PLE lookup</text><text x="230" y="132" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">n-gram rows from</text><text x="230" y="152" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">pinned DRAM (PCIe)</text><line x1="388" y1="165" x2="406" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="406" y="80" width="170" height="170" rx="10" fill="#2563eb" fill-opacity="0.12"/><rect x="406" y="80" width="170" height="170" rx="10" fill="none" stroke="#2563eb" stroke-width="1.5"/><text x="418" y="106" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">48 layers</text><text x="418" y="132" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">36 × Gated DeltaNet</text><text x="418" y="152" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">(fixed state)</text><text x="418" y="172" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">12 × full attention</text><text x="418" y="192" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">(FP8 KV cache)</text><line x1="576" y1="165" x2="594" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="594" y="80" width="170" height="170" rx="10" fill="#7c3aed" fill-opacity="0.12"/><rect x="594" y="80" width="170" height="170" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.5"/><text x="606" y="106" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">MoE per layer</text><text x="606" y="132" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">router picks 10 of 512</text><text x="606" y="152" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">experts + shared expert</text><text x="606" y="172" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">NVFP4, CUTLASS kernel</text><line x1="764" y1="165" x2="782" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="782" y="80" width="170" height="170" rx="10" fill="#16a34a" fill-opacity="0.12"/><rect x="782" y="80" width="170" height="170" rx="10" fill="none" stroke="#16a34a" stroke-width="1.5"/><text x="794" y="106" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Verify drafts</text><text x="794" y="132" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">accept ~2.1 tokens</text><text x="794" y="152" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">per step on average</text><text x="794" y="172" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">→ ~185 tok/s</text><text x="30" y="290" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">Why it's fast: only ~6B parameters are active per token, the active experts are 4-bit, the rest is FP8,</text><text x="30" y="312" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">KV is FP8 and small, and speculative decoding turns one forward pass into ~2 tokens.</text></g></svg>
