<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="NVFP4 conversion pipeline"><title>NVFP4 conversion pipeline</title><rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#e2e8f0"/><g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><text x="30" y="40" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">Building our own NVFP4 checkpoint (experts only)</text><rect x="30" y="70" width="200" height="120" rx="10" fill="#64748b" fill-opacity="0.12"/><rect x="30" y="70" width="200" height="120" rx="10" fill="none" stroke="#64748b" stroke-width="1.5"/><text x="42" y="94" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">BF16 source</text><text x="42" y="116" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">Qwen3.8 Flash-Next</text><text x="42" y="135" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">Heretic (uncensored)</text><text x="42" y="154" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">360 GB · 53 files</text><text x="42" y="173" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">SHA-256 verified</text><rect x="280" y="70" width="240" height="120" rx="10" fill="#7c3aed" fill-opacity="0.12"/><rect x="280" y="70" width="240" height="120" rx="10" fill="none" stroke="#7c3aed" stroke-width="1.5"/><text x="292" y="94" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Routed experts → NVFP4</text><text x="292" y="116" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">gate / up / down only</text><text x="292" y="135" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">FP4 E2M1, group 16, FP8 scales</text><text x="292" y="154" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">RadixArk calibrated input_scale</text><text x="292" y="173" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">gate+up share weight_scale_2</text><rect x="280" y="200" width="240" height="100" rx="10" fill="#2563eb" fill-opacity="0.12"/><rect x="280" y="200" width="240" height="100" rx="10" fill="none" stroke="#2563eb" stroke-width="1.5"/><text x="292" y="224" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Kept 16-bit</text><text x="292" y="246" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">attention (GDN + QSA), shared</text><text x="292" y="265" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">experts, router, embeddings,</text><text x="292" y="284" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">lm_head, vision, MTP head, PLE</text><rect x="570" y="70" width="170" height="120" rx="10" fill="#16a34a" fill-opacity="0.12"/><rect x="570" y="70" width="170" height="120" rx="10" fill="none" stroke="#16a34a" stroke-width="1.5"/><text x="582" y="94" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Checkpoint</text><text x="582" y="116" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">186 GB</text><text x="582" y="135" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">ModelOpt layout</text><text x="582" y="154" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">rel. error 0.00893</text><text x="582" y="173" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">(reference 0.00892)</text><rect x="780" y="70" width="150" height="230" rx="10" fill="#ea580c" fill-opacity="0.12"/><rect x="780" y="70" width="150" height="230" rx="10" fill="none" stroke="#ea580c" stroke-width="1.5"/><text x="792" y="94" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">Load (SGLang)</text><text x="792" y="116" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">experts: NVFP4</text><text x="792" y="135" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">CUTLASS MoE</text><text x="792" y="154" font-size="12" fill="#475569" font-weight="normal" text-anchor="start"></text><text x="792" y="173" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">16-bit layers →</text><text x="792" y="192" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">MXFP8 online</text><text x="792" y="211" font-size="12" fill="#475569" font-weight="normal" text-anchor="start"></text><text x="792" y="230" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">PLE → DRAM</text><text x="792" y="249" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">KV → FP8</text><line x1="230" y1="130" x2="278" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="230" y1="160" x2="278" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="520" y1="130" x2="568" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="520" y1="250" x2="568" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><line x1="740" y1="130" x2="778" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/></g></svg>
