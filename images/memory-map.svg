<svg xmlns="http://www.w3.org/2000/svg" width="960" height="445" viewBox="0 0 960 445" role="img" aria-label="Memory map"><title>Memory map</title><rect x="0.5" y="0.5" width="959" height="444" rx="14" fill="#ffffff" stroke="#e2e8f0"/><g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><text x="30" y="40" font-size="20" fill="#0f172a" font-weight="bold" text-anchor="start">What lives where (production build)</text><text x="30" y="78" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">GPU memory (VRAM) — 96 GB, ~90 GB used at --mem-fraction-static 0.95</text><rect x="30" y="90" width="637.5" height="56" rx="0" fill="#7c3aed" fill-opacity="1"/><text x="38" y="114" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">NVFP4 experts</text><text x="38" y="134" font-size="12" fill="#ffffff" font-weight="normal" text-anchor="start">~68 GB</text><rect x="667.5" y="90" width="112.5" height="56" rx="0" fill="#2563eb" fill-opacity="1"/><rect x="780.0" y="90" width="93.75" height="56" rx="0" fill="#16a34a" fill-opacity="1"/><rect x="873.75" y="90" width="37.5" height="56" rx="0" fill="#0d9488" fill-opacity="1"/><rect x="911.25" y="90" width="18.75" height="56" rx="0" fill="#e2e8f0" fill-opacity="1"/><rect x="30" y="158" width="12" height="12" rx="2" fill="#7c3aed" fill-opacity="1"/><text x="48" y="169" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">NVFP4 experts  ~68 GB</text><rect x="260" y="158" width="12" height="12" rx="2" fill="#2563eb" fill-opacity="1"/><text x="278" y="169" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">other weights (FP8)  ~8–16 GB</text><rect x="490" y="158" width="12" height="12" rx="2" fill="#16a34a" fill-opacity="1"/><text x="508" y="169" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">KV cache (FP8)  ~10 GB = 825k tokens</text><rect x="720" y="158" width="12" height="12" rx="2" fill="#0d9488" fill-opacity="1"/><text x="738" y="169" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">state cache + graphs</text><rect x="30" y="90" width="900" height="56" rx="8" fill="none" stroke="#475569"/><text x="30" y="238" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">System RAM (DRAM) — 256 GB</text><rect x="30" y="250" width="358.59375" height="56" rx="0" fill="#ea580c" fill-opacity="1"/><text x="38" y="274" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">PLE n-gram table</text><text x="38" y="294" font-size="12" fill="#ffffff" font-weight="normal" text-anchor="start">102 GB, pinned</text><rect x="388.59375" y="250" width="541.40625" height="56" rx="0" fill="#f1f5f9" fill-opacity="1"/><text x="400.59375" y="284" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">OS, page cache, other services, free (~140 GB)</text><rect x="30" y="250" width="900" height="56" rx="8" fill="none" stroke="#475569"/><text x="30" y="345" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">• KV cache is small because only 12 of 48 layers use full attention; 36 Gated DeltaNet layers keep a fixed-size state.</text><text x="30" y="369" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">• Nothing is offloaded to DRAM except the PLE table: each token reads a few PLE rows over PCIe, cheap compared with the experts.</text><text x="30" y="393" font-size="13" fill="#475569" font-weight="normal" text-anchor="start">• At --mem-fraction-static 0.90 the KV cache shrinks to 471,680 tokens (5.7 GB) with no speed gain.</text><text x="930" y="433" font-size="11" fill="#475569" font-weight="normal" text-anchor="end">nvidia-smi, SGLang /metrics, /proc · results/memory.json</text></g></svg>
